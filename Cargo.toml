[workspace]
resolver = "3"
members = ["crates/lore-core", "crates/lore", "crates/lore-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/wryskware/lore"

[workspace.dependencies]
lore-core = { path = "crates/lore-core" }

# Pins per design/7_Research/raw/E_rust-stack.md (parent-verified 2026-08-14).
# Declared here even before first use so every crate inherits the same pin.
anyhow = "1.0"
axum = "0.8"
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
# Platform data directory (`%LOCALAPPDATA%\lore` on Windows). Tiny, no
# transitive weight; the alternative is hand-rolling KNOWNFOLDERID lookups.
dirs = "6"
# Only `future::try_join_all`, for fanning one embed call's wire batches out
# concurrently. Already in the tree transitively (reqwest, axum), so the
# direct pin adds no weight; default features off keeps it that way.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# OS randomness, for push session handles (D-0015: unguessable, bound to
# project + epoch). Already in the tree transitively, so the direct pin adds no
# weight, and the alternative — deriving handles from a counter or a clock —
# would make a handle guessable, which is the one property it has to have.
getrandom = "0.4"
# ripgrep's walker: gitignore semantics (including nested and parent
# `.gitignore` files) for free, which the indexer needs to match what a
# developer expects to be searchable.
ignore = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
# No TLS feature on purpose. Every reqwest caller in Lore talks to loopback
# (the daemon's own API, D-0007) or to a local embedding server (D-0003:
# local-only, no cloud providers), so http suffices — and reqwest's `rustls`
# feature drags in aws-lc-sys, which needs NASM+cmake to build on Windows MSVC.
# Re-enabling TLS later is a one-line feature change.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Server side only, and only the stdio transport (D-0007: `lore-mcp` is a thin
# stdio proxy). `macros` gives `#[tool]`/`#[tool_router]`/`#[tool_handler]`;
# `server` transitively enables `schemars`, which rmcp re-exports — so tool
# parameter structs derive `rmcp::schemars::JsonSchema` with no separate pin.
# Default features dropped: `base64` is only needed for image/audio content.
# (`client` is added as a dev-dependency in lore-mcp for the golden harness.)
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
insta = "1"
# `net` added for axum's TcpListener; `fs` deliberately not enabled — file IO
# happens on the blocking pool alongside the (blocking) store.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Config file parsing (`config.toml`, design 3.1 §embedding provider config).
toml = "1"
# Dev-only: `ServiceExt::oneshot` drives the axum Router in tests without
# binding a real port.
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
# Grammar pins (work package 3). All of these expose `LANGUAGE: LanguageFn`
# via tree-sitter-language 0.1 and parse at ABI 14/15, which the 0.26 runtime
# accepts; these are the newest releases published at pin time (2026-08-14).
tree-sitter-c-sharp = "0.23.5"   # flagship target (D-0003)
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2" # provides both LANGUAGE_TYPESCRIPT and LANGUAGE_TSX

[profile.release]
lto = "thin"
