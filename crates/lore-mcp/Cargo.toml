[package]
name = "lore-mcp"
description = "Thin stdio MCP client proxying to the Lore daemon over loopback HTTP. Owns no index state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
lore-core.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `io-std` for the stdio transport (rmcp's `transport-io` asks for it too; kept
# explicit so the dependency is visible where it is used).
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
insta.workspace = true
# Client side is test-only: the golden harness drives the real MCP protocol over
# an in-memory duplex instead of asserting on handler internals. Dev-dependency
# features do not unify into the normal build under resolver 3, so the shipped
# binary stays server-only.
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
