[package]
name = "lore"
description = "Lore — local context daemon for AI coding agents. Single binary: daemon + CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["wasm-grammars"]
# Runtime `.wasm` tree-sitter grammars for chunker plugins (wasmtime, via
# tree-sitter's own `wasm` feature). Default-on because the flagship plugin
# shape needs it; separable because the spike measured the cost at +42 s clean
# build, +10.2 MiB binary and +101 crates, which a grammar-bundled-only build
# should not have to pay. Everything else about plugins — manifests, the
# registry, fingerprints, the `windows` strategy — compiles without it, and a
# manifest declaring a `grammar` chunker still *parses*: the chunker registers
# as unavailable with a typed reason instead of failing the plugin.
wasm-grammars = ["tree-sitter/wasm"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
camino.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
getrandom.workspace = true
ignore.workspace = true
lore-core.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true

# `lore start` has to clear HANDLE_FLAG_INHERIT on its own std handles before
# it spawns a detached child; see `cli::detach`. Already in the lock as a
# transitive dependency of tokio and friends, so this costs no new build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tower.workspace = true
